[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbrain-zarr"
version = "1.0.0"
description = "Windowed EEG Welch PSD + ECG HRV measures written to per-subject Zarr stores; dataset-agnostic (study parameters are passed in)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy", "scipy", "zarr>=3",
    "vollmer-hrv @ git+https://github.com/dokyuhan/vollmer-hrv.git",
]

[tool.setuptools]
packages = ["heartbrain_zarr"]

[tool.setuptools.package-dir]
heartbrain_zarr = "src"
